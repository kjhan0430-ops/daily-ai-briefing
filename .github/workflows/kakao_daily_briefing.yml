name: 매일 아침 8시 카카오톡 AI 브리핑 발송

on:
  schedule:
    # 한국시간(KST) 매일 아침 08:00 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          pip install requests

      - name: 카카오톡 브리핑 발송 및 최신 데이터 생성
        env:
          TZ: Asia/Seoul
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          python send_kakao_briefing.py

      - name: 최신 브리핑 데이터를 웹/앱 대시보드에 자동 저장 및 배포
        run: |
          git config user.name "daily-ai-briefing-bot"
          git config user.email "actions@github.com"
          git add briefing_data.json || true
          git diff --staged --quiet || (git commit -m "chore: auto-update daily briefing data" && git push)
